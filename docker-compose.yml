services:
  llm-eval:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data
      - ./eval_reports:/app/eval_reports
    environment:
      - LLM_EVAL_PIPELINE__MAX_WORKERS=4
      - LLM_EVAL_LOG_LEVEL=INFO
    command: ["benchmark", "--output-dir", "eval_reports/docker_benchmark"]
    healthcheck:
      test: ["CMD", "python", "-c", "import llm_eval; print(llm_eval.__version__)"]
      interval: 30s
      timeout: 10s
      retries: 3
