name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ matrix.python-version }}-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Lint (Ruff Check)
        run: ruff check src/ tests/

      - name: Format Check (Ruff Format)
        run: ruff format --check src/ tests/

      - name: Type Check (MyPy)
        run: mypy src/ --ignore-missing-imports || true

      - name: Security Scan (Bandit)
        run: bandit -r src/ -ll -q || true

      - name: Run Pytest Suite with Coverage
        run: |
          pytest tests/ -v \
            --cov=llm_eval \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Dry-Run Evaluation Benchmark
        run: |
          llm-eval version
          llm-eval metrics
          llm-eval benchmark --output-dir results/ci_benchmark

      - name: Upload Evaluation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evaluation-results-py${{ matrix.python-version }}
          path: results/ci_benchmark/
