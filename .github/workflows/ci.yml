name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: poetry-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            poetry-${{ matrix.python-version }}-

      - name: Install Poetry
        run: |
          pip install poetry

      - name: Install Dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --no-root --with dev

      - name: Lint (Ruff Check)
        run: poetry run ruff check src/ tests/

      - name: Format Check (Ruff Format)
        run: poetry run ruff format --check src/ tests/

      - name: Type Check (MyPy)
        run: poetry run mypy src/ --ignore-missing-imports || true

      - name: Security Scan (Bandit)
        run: poetry run bandit -r src/ -ll -q || true

      - name: Run Pytest Suite with Coverage
        run: |
          poetry run pytest tests/ -v \
            --cov=llm_eval \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Dry-Run Evaluation Benchmark
        run: |
          poetry run llm-eval version
          poetry run llm-eval metrics
          poetry run llm-eval benchmark --output-dir results/ci_benchmark

      - name: Upload Evaluation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evaluation-results-py${{ matrix.python-version }}
          path: results/ci_benchmark/
